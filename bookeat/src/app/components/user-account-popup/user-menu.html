@if (user(); as u) {
  <div ngbDropdown class="d-inline-block" placement="bottom-end">
    <div
      class="user-avatar-trigger d-flex align-items-center"
      ngbDropdownToggle
      id="profileDropdown"
      data-bs-toggle="dropdown"
      aria-expanded="false">

      @if (u.image) {
        <img [src]="u.image" class="rounded-circle border shadow-sm" width="45" height="45">
      } @else {
        <div class="avatar-placeholder rounded-circle border shadow-sm bg-light text-secondary">
          <i class="bi bi-person-circle"></i>
        </div>
      }
    </div>

    <ul ngbDropdownMenu class="dropdown-menu dropdown-menu-end shadow-lg border-0 py-2" aria-labelledby="profileDropdown">

      <li>
        <a ngbDropdownItem class="dropdown-item d-flex align-items-center gap-3 py-2" [routerLink]="['/edit-profile-page']">
          <i class="bi bi-person-gear fs-5"></i>
          <span>My Account</span>
        </a>
      </li>

      @if (u.role === 'RESTAURANT') {
        <li>
          <a ngbDropdownItem class="dropdown-item d-flex align-items-center gap-3 py-2" [routerLink]="['/my-restaurant-page']">
            <i class="bi bi-shop fs-5"></i>
            <span>My Restaurant</span>
          </a>
        </li>
      }

      <li>
        <a ngbDropdownItem class="dropdown-item d-flex align-items-center gap-3 py-2" [routerLink]="['/reservations-page']" [queryParams]="{time: 'past'}">
          <i class="bi bi-calendar-check fs-5"></i>
          <span>Past Reservations</span>
        </a>
      </li>

      <li>
        <a ngbDropdownItem class="dropdown-item d-flex align-items-center gap-3 py-2" [routerLink]="['/reservations-page']" [queryParams]="{time: 'incoming'}">
            <i class="bi bi-calendar-event fs-5"></i>
          <span>Incoming Reservations</span>
        </a>
      </li>

      <li><hr class="dropdown-divider mx-2"></li>

      <li>
        <button (click)="logout()" ngbDropdownItem class="dropdown-item d-flex align-items-center gap-3 py-2 text-danger">
          <i class="bi bi-box-arrow-right fs-5"></i>
          <span>Log Out</span>
        </button>
      </li>
    </ul>
  </div>
}
