<div class="d-flex flex-column align-items-center gap-3">
  @if (previewUrl()) {
    <img [src]="previewUrl()" class="insert-image__preview rounded-circle object-fit-cover" alt="Preview">
  }
  <input #fileInput type="file" accept="image/*" class="d-none" (change)="onFileChange(fileInput)">
  <button class="btn-custom-secondary fs-5 d-flex align-items-center gap-2" (click)="fileInput.click()">
    <i class="bi bi-upload"></i>
    <span>Insert Image</span>
  </button>
</div>
