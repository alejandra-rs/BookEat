<div class="map-viewport position-relative border rounded">
  <div class="position-absolute d-flex flex-column gap-2 p-2" style="bottom: 1rem; right: 1rem; z-index: 10;">
    <button class="btn btn-custom-secondary" (click)="zoomIn()"><i class="bi bi-plus-lg"></i></button>
    <button class="btn btn-custom-secondary" (click)="zoomOut()"><i class="bi bi-dash-lg"></i></button>
    <button class="btn btn-custom-secondary" (click)="resetView()"><i class="bi bi-arrow-counterclockwise"></i></button>
  </div>

  <svg #svgEl [attr.viewBox]="viewBox()" class="w-100 h-100" style="cursor: grab; display: block;">
    <polygon
      [attr.points]="outlinePoints()"
      fill="var(--bg-secondary)" stroke="var(--text-primary)" stroke-width="0.05"
    />

    @for (t of tableProps(); track t.id) {
      <g (click)="toggleTable(t.id)" (pointerdown)="$event.stopPropagation()">
        @if (t.shape === 'round') {
          <ellipse
            [attr.cx]="t.cx" [attr.cy]="t.cy" [attr.rx]="t.w / 2" [attr.ry]="t.h / 2"
            [attr.fill]="isSelected(t.id) ? '#2ecc71' : isOccupied(t.id) ? '#dcdcdc' : 'var(--bg-primary)'"
            [attr.stroke]="isOccupied(t.id) ? '#bbb' : 'var(--text-primary)'"
            stroke-width="0.05"
            [style.cursor]="isOccupied(t.id) ? 'not-allowed' : 'pointer'"
          />
        } @else {
          <rect
            [attr.x]="t.p1.x" [attr.y]="t.p1.y" [attr.width]="t.w" [attr.height]="t.h" rx="0.2"
            [attr.fill]="isSelected(t.id) ? '#2ecc71' : isOccupied(t.id) ? '#dcdcdc' : 'white'"
            [attr.stroke]="isOccupied(t.id) ? '#bbb' : '#333'"
            stroke-width="0.05"
            [style.cursor]="isOccupied(t.id) ? 'not-allowed' : 'pointer'"
          />
        }
        <text
          [attr.x]="t.cx" [attr.y]="t.cy" [style.font-size.px]="fontSizeUnits()"
          text-anchor="middle" dominant-baseline="middle"
          [attr.fill]="isSelected(t.id) ? 'white' : isOccupied(t.id) ? '#999' : 'var(--text-primary)'"
          style="pointer-events: none; user-select: none;"
        >{{ t.capacity }}</text>
      </g>
    }
  </svg>
</div>
