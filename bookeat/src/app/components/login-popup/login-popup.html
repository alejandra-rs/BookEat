@if (open()) {
  <div class="popup-backdrop" (click)="close()">
    <div class="menu-popup rounded-4 p-0 shadow-lg" (click)="$event.stopPropagation()">
      <app-form-card
        title="Login or create an account"
        subtitle="Log in with your BookEat account..."
        classname="card p-4 d-flex flex-column align-items-center justify-content-center text-center gap-3 bg-transparent border-0"
        styles="box-shadow: none; color: var(--text-primary)"
      >
        <form [formGroup]="loginForm" (submit)="onSubmit($event)" class="w-100 d-flex flex-column gap-2">
          <div class="row g-2 justify-content-center">
            <div class="col-12">
              <input formControlName="email" type="email"
                     class="form-control form-control-lg custom-input"
                     [class.is-invalid]="showErrors('email')"
                     placeholder="Email">
              @if (showErrors('email')) {
                @if (emailCtrl.hasError('required')) {
                  <div class="invalid-feedback ps-2 text-start d-block small">Email is required</div>
                } @else if (emailCtrl.hasError('email')) {
                  <div class="invalid-feedback ps-2 text-start d-block small">Invalid email</div>
                }
              }
            </div>
            <div class="col-12">
              <input formControlName="password" type="password"
                     class="form-control form-control-lg custom-input"
                     [class.is-invalid]="showErrors('password')"
                     placeholder="Password">
              @if (showErrors('password')) {
                <div class="invalid-feedback ps-2 text-start d-block small">Password is required</div>
              }
            </div>
          </div>
          @if (error()) {
            <div class="alert alert-danger py-2 px-3 border-0 rounded-3 small text-start shadow-sm d-flex align-items-center w-100">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error() }}
            </div>
          }
          <button type="submit" class="btn btn-dark w-100 py-2 rounded-pill fw-bold shadow-sm" [disabled]="submitted()">
            {{ submitted() ? 'Logging in...' : 'Login' }}
          </button>
          <button type="button" class="btn btn-light w-100 py-2 rounded-pill fw-medium shadow-sm border d-flex align-items-center justify-content-center gap-2" (click)="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
            Continue with Google
          </button>
          <button type="button" class="btn btn-light w-100 py-2 rounded-pill fw-medium shadow-sm border" (click)="openRegister.emit()">
            Register
          </button>
        </form>
      </app-form-card>
    </div>
  </div>
}
