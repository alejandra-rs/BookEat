@if (open()) {
  <div class="popup-backdrop" (click)="close()">
    <div class="booking-confirmation rounded-4 shadow-lg p-4 d-flex flex-column align-items-center gap-4 text-center" (click)="$event.stopPropagation()">
      <div>
        <h2 class="fw-bold fs-3">Booking Confirmed!</h2>
        <p class="text-secondary mb-0">Congratulations, your reservation has been confirmed!</p>
      </div>

      <section class="w-100 d-flex flex-column gap-3">
        <h3 class="fw-semibold fs-5">Reservation Details</h3>
        @if (mapUrl()) {
          <div class="rounded-3 overflow-hidden">
            <iframe [src]="mapUrl()" width="100%" height="220" frameborder="0" scrolling="no"></iframe>
          </div>
        }
        <div class="d-flex flex-column gap-2 text-start">
          <p class="d-flex align-items-center gap-2 m-0">
            <i class="bi bi-shop fs-5 text-secondary"></i>
            <span>{{ name() }}</span>
          </p>
          <p class="d-flex align-items-center gap-2 m-0">
            <i class="bi bi-geo-alt fs-5 text-secondary"></i>
            <span>{{ address() }}</span>
          </p>
          <p class="d-flex align-items-center gap-2 m-0">
            <i class="bi bi-calendar-event fs-5 text-secondary"></i>
            <time>{{ datetime() }}</time>
          </p>
        </div>
      </section>
    </div>
  </div>
}
