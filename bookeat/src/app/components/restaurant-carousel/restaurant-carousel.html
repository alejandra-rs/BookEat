<div class="d-flex flex-column gap-4">
  <h1>{{ title() }}</h1>
  <div class="d-flex flex-row overflow-auto gap-3 mh-100">
    @if (restaurants$ | async; as restaurants) {
      @for (restaurant of restaurants | shuffle | slice:0:15; track restaurant.id) {
        <app-restaurant-item [restaurant]="restaurant" />
      }
    }
  </div>
</div>
