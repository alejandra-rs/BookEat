<div [routerLink]="['/', restaurant().id]"
     class="restaurant-item d-flex flex-column overflow-hidden position-relative rounded-3 text-decoration-none shadow-sm">

  <img [src]="restaurant().image || '../../assets/img/restaurant-item.png'"
       class="restaurant-item__image w-100 object-fit-cover flex-shrink-0"
       alt="Imagen de {{ restaurant().name }}">

  <div class="d-flex flex-column p-3 h-100">
    <h5 class="restaurant-item__title fw-bold mb-1">{{ restaurant().name }}</h5>

    <div class="d-flex justify-content-between align-items-center mt-auto">
      <app-price-label class="small fw-medium m-0 lh-lg"
                       [minPrice]="restaurant().minPrice"
                       [maxPrice]="restaurant().maxPrice" />
      <app-user-score [score]="restaurant().rating | averageRating" />
    </div>
  </div>
</div>
