<div class="card h-100" style="width: 18rem;">

  <img [src]="restaurant.image || '../../assets/img/restaurant-item.png'"
       class="card-img-top object-fit-cover"
       style="height: 12rem;"
       alt="Imagen de {{restaurant.name}}">

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{restaurant.name}}</h5>

    <div class="d-flex justify-content-between flex-wrap gap-2 mt-auto">
      <app-user-score [score]="restaurant.rating"></app-user-score>
      <app-price-label [price]="restaurant.price"></app-price-label>
    </div>
  </div>
</div>
