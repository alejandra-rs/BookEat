@if (open()) {
  <div class="popup-backdrop" (click)="close()">
    <div class="edit-profile-image-dialog rounded-4" (click)="$event.stopPropagation()">
      <div class="d-flex flex-column p-5 gap-4">
        <section class="d-flex flex-column align-items-center gap-3">
          <h2>Edit your profile image</h2>
          <app-insert-image (filesChange)="pendingFile.set($event[0])"/>
        </section>
        @if (saveError()) {
          <div class="alert alert-danger py-2 small">{{ saveError() }}</div>
        }
        <footer class="d-flex w-100 justify-content-end gap-2">
          <button class="btn-custom-secondary fs-5 px-4" (click)="close()">Cancel</button>
          <button class="btn-custom-primary fs-5 px-4" [disabled]="saving()" (click)="save()">
            @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> } Save
          </button>
        </footer>
      </div>
    </div>
  </div>
}
