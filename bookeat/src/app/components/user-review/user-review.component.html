<article class="user-review d-flex flex-column gap-3 p-4 w-100 rounded-4">
  <header class="d-flex flex-column gap-3">
    <div class="d-flex justify-content-between align-items-start w-100">

      <div class="d-flex align-items-center gap-3 flex-1 min-width-0">

        <div>
          <img class="user-review__avatar rounded-circle object-fit-cover flex-shrink-0"
               [src]="review()?.user?.image" alt="">
        </div>

        <div class="d-flex flex-column justify-content-center w-100 min-width-0">
          <div>
            <h2 class="m-0 text-truncate">{{ review()?.user?.accountName }}</h2>
          </div>
          <p class="m-0 user-review__date">{{ review()?.datetime }}</p>
        </div>

      </div>

      <app-user-score [score]="review()?.rating"
                      class="d-flex flex-column align-items-end flex-shrink-0 ms-3 user-review__score"
      ></app-user-score>

    </div>

    <h3 class="m-0">{{ review()?.title }}</h3>
  </header>

  <p class="m-0">{{ review()?.description }}</p>

  <div class="d-sm-flex justify-content-evenly">
    <div class="d-flex flex-column">
      <h4><em>Pros</em></h4>
      <p>{{ review()?.pros }}</p>
    </div>
    <div class="d-flex flex-column">
      <h4><em>Cons</em></h4>
      <p>{{ review()?.cons }}</p>
    </div>
  </div>

  <div class="d-flex gap-3 overflow-auto">
    @for (image of review()?.images; track image) {
      <img [src]="image" alt="Imagen de reseña" class="user-review__avatar object-fit-cover">
    }
  </div>

</article>
