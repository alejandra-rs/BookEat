<div class="d-flex align-items-center">
  <input class="d-none"
         ngbDatepicker
         #picker="ngbDatepicker"
         [(ngModel)]="selectedDate"
         (dateSelect)="onDateSelected($event)"
         [positionTarget]="calendarBtn"
         placement="bottom-start"
  >
  <button #calendarBtn class="btn gap-3 d-flex" type="button" (click)="picker.toggle()">
    <i class="bi bi-calendar"></i>
    @if (selectedDate) {
      <span>{{ selectedDate.day }}/{{ selectedDate.month }}/{{ selectedDate.year }}</span>
    } @else {
      <span>Date</span>
    }
    <i class="bi bi-chevron-down"></i>
  </button>

</div>
