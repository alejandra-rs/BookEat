<div class="d-flex flex-column px-4 py-4 gap-5">

  <a [routerLink]="['/', id]" class="d-inline-flex align-items-center gap-2 text-reset text-decoration-none">
    <i class="bi bi-arrow-left fs-5"></i>
     <span>Currently booking: <strong>{{ restaurant()?.name }}</strong></span>
  </a>

    <div class="text-center d-flex flex-column gap-2">
      <p class="fst-italic fs-5 mb-0">Confirm your Booking Details at</p>
      <h2 class="fw-bold display-5">{{ restaurant()?.name }}</h2>
    </div>

    <div class="row g-5 justify-content-center">
      <div class="col-12 col-xxl-4 d-flex flex-column align-items-center gap-3">
        <h3 class="fw-semibold fs-4">Diners</h3>
        <app-diners-selector />
      </div>

      <div class="col-12 col-md-6 col-xxl-4 d-flex flex-column align-items-center gap-3">
        <h3 class="fw-semibold fs-4">Date</h3>
        <ngb-datepicker [ngModel]="selectedDate()" (dateSelect)="onDateSelected($event)"
                        [minDate]="minDate" [markDisabled]="isDateDisabled"/>
      </div>

      <div class="col-12 col-md-6 col-xxl-4 d-flex flex-column align-items-center gap-3">
        <h3 class="fw-semibold fs-4">Time</h3>
        @if (selectedDate()) {
          <app-hour-table [restaurant]="restaurant()!" [date]="selectedDate()"
                          [selectedTime]="selectedTime()" (timeSelected)="onTimeSelected($event)"/>
        } @else {
          <p class="fst-italic text-center">Please select a date first to see available hours.</p>
        }
      </div>
    </div>

    <div class="d-flex justify-content-center pb-4">
      <button class="btn btn-custom-primary px-4 py-2 fs-5" [disabled]="!canConfirm()" (click)="selectTable()">
        Confirm Booking Details
      </button>
    </div>

</div>
