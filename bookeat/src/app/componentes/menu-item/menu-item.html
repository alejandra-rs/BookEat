<article class="d-flex align-items-stretch w-100 p-3 px-md-4 gap-3 rounded-5 menu-item-custom">
  <div class="flex-grow-1">
    <header class="d-flex align-items-center justify-content-between">
      <h3 class="m-0">{{ name }}</h3>
      <div>
        <data [value]="price" class = "fw-bold">{{price}}</data>
        <span>€</span>
      </div>
    </header>
    <p class="mt-2 mb-0"> {{description}}</p>
  </div>
  <div class="menu-item__image">
    <img [src]="imageSrc" [alt]="name" class="w-100 h-100 object-fit-contain">
  </div>
</article>
