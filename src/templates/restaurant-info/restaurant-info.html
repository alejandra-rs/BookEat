<link rel="stylesheet" href="../../templates/restaurant-info/restaurant-info.css">
<link rel="stylesheet" href="/styles.css">

<article class="restaurant-info">
    <img data-template="src-images" src="../../assets/img/restaurant-item.png" alt="A restaurant image" class="restaurant-info__image">
    <div class ="restaurant-info__content">
        <header class="restaurant-info__content__header">
            <h1 data-template="text-name" >Restaurant Name</h1>
            <span load-template="user-score"></span>
        </header>
        <p data-template="text-description">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean vel sem dui. Lorem ipsum dolor sit amet,
            consectetur adipiscing elit.
        </p>

        <section class="restaurant-info__content__categories" data-template="list-categories" filter="categories">
            <template>
                <span data-template="text-name">Category</span>
            </template>
        </section>

        <div class="restaurant-info__content__buttons">
            <button id="menu-icon" class="restaurant-info__content__buttons__menu secondary-button" data-opens="menu-popup" >
                <img src="../../assets/icons/restaurant-menu.svg" alt="restaurant menu" class="restaurant-info__content__buttons__menu__icon icon">
            </button>
            <a data-template="href-id" href="../../pages/booking-details-page/booking-details-page.html">
                <button class="restaurant-info__book_buttons primary-button"> Book </button>
            </a>
        </div>
    </div>
    <div id="menu-popup-container" load-template="menu-popup"></div>

</article>
<script src="../../js/auth-mode.js"></script>
