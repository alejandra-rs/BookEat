<link rel="stylesheet" href="../../templates/user-review/user-review.css">
<link rel="stylesheet" href="/styles.css">

<article class="user-review">

  <header class="user-review__header">
    <div class="user-review__header__metadata">

      <div class="user-review__header__metadata__left">

        <div data-context="users" related="userId">
          <img data-template="src-image" class="user-review__header__image" src="../../assets/img/restaurant-item.png" alt="" >
        </div>

        <div class="user-review__header__metadata__left__text">
          <div data-context="users" related="userId"> <h2 data-template="text-name">User Name</h2> </div>
          <p class="user-review__header__metadata__left__text__date" data-template="text-createdAt"></p>
        </div>

      </div>

      <div class="user-review__header__metadata__right">
        <div class="user-review__header__metadata__other__value" load-template="user-score"></div>
      </div>

    </div>

    <h3 data-template="text-title">Review title</h3>
  </header>

  <p data-template="text-description"></p>
  <div class="user-review__pros-cons">
    <div class="user-review__pros-cons__section">
      <h4><em>Pros</em></h4>
      <p data-template="text-pros"></p>
    </div>
    <div class="user-review__pros-cons__section">
      <h4><em>Cons</em></h4>
      <p data-template="text-cons"></p>
    </div>
  </div>
  <div data-template="list-images" class="user-review__images">
    <template>
      <img src="" alt="restaurant-image" data-template="src-self">
    </template>
  </div>
</article>
