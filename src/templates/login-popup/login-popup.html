<link rel="stylesheet" href="../../css/forms.css">
<dialog id="login-popup">

  <div class="login-form form">
    <h3>Login or create an account</h3>
    <p>Log in with your BookEat account...</p>

    <form id="form-login">
      <div class="form__fields">
        <label class="form__row"> <input name="email" type="email" placeholder="Email" required> </label>
        <label class="form__row"> <input name="password" type="password" placeholder="Password" required> </label>
      </div>
      <button type="submit" class="primary-button">Login</button>
    </form>

    <button type="button" class="secondary-button" id="registerButton" data-opens="register-popup">Register</button>
  </div>

</dialog>
