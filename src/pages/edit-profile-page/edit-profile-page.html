<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../pages/edit-profile-page/edit-profile-page.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script type="module" src="../../js/init-components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body data-page-context="my-profile">
  <header load-template="header"></header>
  <main class="edit-profile-page">
    <section class="edit-profile-page__public">
      <div class="edit-profile-page__public__image">
        <img data-template="src-image" src="" alt="">
        <div class="" load-template="edit-button"></div>
      </div>
      <div class="custom-property edit-profile-page__public__name" load-template="edit-property"
        data-icon="../../assets/icons/user-profile.svg" data-label="Account Name" data-type="text"
        data-key="accountName"></div>
    </section>
    <section class="edit-profile-page__account-management">
      <h2>Account Management</h2>
      <div class="custom-property" load-template="edit-property" data-icon="../../assets/icons/id.svg" data-label="Name"
        data-type="text" data-key="name"></div>

      <div class="custom-property" load-template="edit-property" data-icon="../../assets/icons/id.svg"
        data-label="Surname" data-type="text" data-key="surname"></div>


      <div class="custom-property" load-template="edit-property" data-icon="../../assets/icons/lock.svg"
        data-label="Password" data-type="password" data-key="password"></div>

      <div class="custom-property" load-template="edit-property" data-icon="../../assets/icons/email.svg"
        data-label="Email" data-type="email" data-key="email"></div>

      <div class="custom-property" load-template="edit-property" data-icon="../../assets/icons/phone.svg"
        data-label="Phone Number" data-type="tel" data-key="phoneNumber"></div>

    </section>
  </main>
  <footer load-template="footer"></footer>

</body>
