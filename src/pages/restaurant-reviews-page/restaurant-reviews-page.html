<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Reviews Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="../../pages/restaurant-reviews-page/restaurant-reviews-page.css">
    <script type="module" src="../../js/init-components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>

<header load-template="header"></header>

<main class="restaurant-reviews-page__main" data-page-context="restaurants">
    <div load-template="restaurant-info"></div>
    <div class="restaurant-reviews-page__image-carousel">
    </div>

    <section class="restaurant-reviews-page__summary">
        <div class="restaurant-reviews-page__summary__mean">
            <div load-template="user-score" class="restaurant-reviews-page__summary__mean__score"></div>
            <span data-template="text-rating" filter="total" class="restaurant-reviews-page__summary__mean__info">999</span> <span> reviews</span>
        </div>
        <div class="restaurant-reviews-page__summary__breakdown" data-template="list-rating" load-template="summary-breakdown"></div>
    </section>

    <section class="restaurant-reviews-page__filters" data-context="reviews">
        <div>
            <h2>Filter</h2>
            <div class="restaurant-reviews-page__filters__buttons">
                <button class="restaurant-reviews-page__filters__button active" data-rating="all">All</button>
                <button class="restaurant-reviews-page__filters__button" data-rating="5">5 Stars</button>
                <button class="restaurant-reviews-page__filters__button" data-rating="4">4 Stars</button>
                <button class="restaurant-reviews-page__filters__button" data-rating="3">3 Stars</button>
                <button class="restaurant-reviews-page__filters__button" data-rating="2">2 Stars</button>
                <button class="restaurant-reviews-page__filters__button" data-rating="1">1 Star</button>
                <button class="restaurant-reviews-page__filters__button" data-photos="true">With Photos</button>
            </div>
        </div>
        <div>
            <h2>Sort by</h2>
            <div class="restaurant-reviews-page__filters__sort-by">
                <label>
                    <select id="sort-reviews" name="sort-by">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                </label>
            </div>
        </div>
    </section>

    <section class="restaurant-reviews-page__reviews" data-context="reviews" related="restaurantId">
        <template><article load-template="user-review"></article></template>
    </section>
    <div load-template="pagination"></div>
</main>

<footer load-template="footer"></footer>
</body>
</html>
