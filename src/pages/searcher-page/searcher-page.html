<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Searcher Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../templates/overview/overview.css">
    <link rel="stylesheet" href="../../pages/searcher-page/searcher-page.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="../../js/init-components.js"></script>
</head>
<body>
<header load-template="header"></header>

<main class="searcher-page">
    <aside class="searcher-page__filters">
        <h3>Price</h3>
        <div class="searcher-page__filters__slider">
            <div class="searcher-page__filters__slider__line"></div>
            <div class="searcher-page__filters__slider__dot left"><span>0</span></div>
            <div class="searcher-page__filters__slider__dot right"><span>100</span></div>
        </div>

        <ul class="searcher-page__filters__list">
            <li> <label> <input type="checkbox"> </label> Lorem ipsum </li>
            <li> <label> <input type="checkbox"> </label> Lorem ipsum </li>
            <li> <label> <input type="checkbox" checked> </label> Lorem ipsum </li>
        </ul>
    </aside>

    <section class="searcher-page__results">
        <div load-template="overview"></div>
        <div load-template="overview"></div>
        <div load-template="overview"></div>
        <div load-template="overview"></div>
        <div load-template="overview"></div>
        <div load-template="overview"></div>
        <div load-template="overview"></div>
    </section>

</main>

<footer load-template="footer"></footer>
</body>
</html>
