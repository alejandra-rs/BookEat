<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searcher Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../templates/overview/overview.css">
    <link rel="stylesheet" href="../../pages/searcher-page/searcher-page.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="../../js/init-components.js"></script>
    <script type="module" src="../../pages/searcher-page/searcher-page.js"></script>
</head>

<body>
    <header load-template="header"></header>

    <main class="searcher-page container-fluid row">
        <aside class="searcher-page__filters col-12 col-lg-3">
            <h3>Price</h3>
            <div class="searcher-page__filters__price">
                <div class="searcher-page__filters__price__slider">
                    <label><input type="range" id="min-price" min="0" max="50" value="0"></label>
                    <label><input type="range" id="max-price" min="0" max="50" value="50"></label>
                </div>
                <div class="searcher-page__filters__price__labels">
                    <span id="min-price-label">0€</span> - <span id="max-price-label">50€</span>
                </div>
            </div>

            <h3 class="mt-4">Categories</h3>
            <ul class="searcher-page__filters__list">
                <li> <label> <input type="checkbox" class="category-filter" value="1"> Italian </label> </li>
                <li> <label> <input type="checkbox" class="category-filter" value="12"> Asian </label> </li>
                <li> <label> <input type="checkbox" class="category-filter" value="13"> Spanish </label> </li>
            </ul>
        </aside>

        <div data-context="restaurants" class="searcher-page__results col-12 col-lg-9">
            <template>
                <div load-template="overview" class="searcher-page__results__card"></div>
            </template>
        </div>

    </main>

    <footer load-template="footer"></footer>
</body>

</html>
