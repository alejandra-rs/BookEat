<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Table</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../pages/book-table-page/book-table-page.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../../pages/book-table-page/book-table-page.js"></script>
    <script type="module" src="../../js/init-components.js"></script>
</head>

<body>

    <header load-template="header"></header>

    <a data-template="href-id" href="../../pages/restaurant-info-page/restaurant-info-page.html">
        <button class="back-button">
            <img src="../../assets/icons/back-button.svg" alt="" class="icon" />
            Currently booking: <strong data-template="text-name"></strong>
        </button>
    </a>

    <main class="book-table-page">
        <div load-template="hour-table"></div>
        <h2 id="hour-table-txt"><em>Please select a date and time to show available tables</em></h2>
        <div id="hour-table-map" load-template="table-map"></div>
        <button id="book-selected" class="primary-button" data-opens="login-popup">Book Selected</button>
    </main>

    <footer load-template="footer"></footer>
</body>

</html>
