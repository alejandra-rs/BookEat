<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../pages/restaurant-info-page/restaurant-info-page.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script type="module" src="../../js/init-components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="restaurant-info-page" data-page-context="restaurants">

    <header load-template="header"></header>

    <main class="restaurant-info-page__main">
        <div load-template="restaurant-info"></div>
        <div class="restaurant-info-page__main__image-carousel" data-template="carousel-gallery">
            <template> <img alt="restaurant-image" src=""> </template>
        </div>

        <section class="restaurant-info-page__main__reviews" data-context="reviews" related="restaurantId">
            <template>
                <article load-template="user-review"></article>
            </template>
        </section>

        <div class="restaurant-info-page__main__read-more">
            <a data-template="href-id" href="../../pages/restaurant-reviews-page/restaurant-reviews-page.html">
                <button class="secondary-button read-more"> Read More </button>
            </a>
        </div>
    </main>

    <footer load-template="footer"></footer>

</body>

</html>
